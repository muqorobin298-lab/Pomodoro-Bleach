<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff6a00; --spark: #ffcf8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #050510; color: #f5f5f5;
      min-height: 100vh; display: flex;
      justify-content: center; align-items: flex-start;
      padding: 40px 20px; overflow-x: hidden;
    }
    #scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
    .layer.aktif { opacity: 1; }
    .kanji {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 45vw; font-weight: 900; color: #fff; opacity: 0.06; white-space: nowrap;
    }
    .orb { position: absolute; top: 9%; right: 10%; width: clamp(120px, 22vw, 260px); aspect-ratio: 1; border-radius: 50%; }
    .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 36vh; }
    #sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -10px; border-radius: 50%;
      background: var(--spark); box-shadow: 0 0 8px var(--spark);
      opacity: 0; animation: naik linear infinite;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    .box {
      position: relative; z-index: 1;
      background: rgba(8,8,18,0.85); backdrop-filter: blur(4px);
      border-left: 8px solid var(--accent);
      width: 100%; max-width: 440px; padding: 28px 24px; text-align: center;
      transition: border-color 1s;
    }
    h1 { font-family: 'Anton', Impact, sans-serif; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; }
    h1 span { color: var(--accent); transition: color 1s; }
    .lokasi {
      font-family: 'Anton', Impact, sans-serif; letter-spacing: 3px; font-size: 13px;
      color: var(--accent); margin: 2px 0 16px; text-transform: uppercase; transition: color 1s;
    }
    .mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .mode button {
      font-family: 'Anton', Impact, sans-serif; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
      padding: 10px 4px; cursor: pointer; color: #f5f5f5;
      background: rgba(255,255,255,0.08); border: 2px solid #f5f5f5; transition: all 0.2s;
    }
    .mode button:hover { transform: translateY(-2px); }
    .mode button.pilih { background: var(--accent); border-color: var(--accent); color: #000; }
    .waktu {
      font-family: 'Anton', Impact, sans-serif; font-size: clamp(72px, 22vw, 110px);
      line-height: 1; letter-spacing: 2px; text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .bar { height: 10px; background: rgba(255,255,255,0.15); margin: 18px 0 8px; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width 0.5s linear, background 1s; }
    .pesan { font-size: 15px; min-height: 22px; margin-bottom: 18px; opacity: 0.9; }
    .kontrol { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; }
    .btn {
      font-family: 'Anton', Impact, sans-serif; font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
      border: 3px solid var(--accent); background: var(--accent); color: #000;
      padding: 12px 34px; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: #fff; border-color: #fff; }
    .btn.sekunder { background: transparent; color: #f5f5f5; border-color: #f5f5f5; padding: 12px 22px; }
    .btn.sekunder:hover { background: #f5f5f5; color: #000; }
    .sesi { font-size: 12px; letter-spacing: 2px; opacity: 0.75; }
    #bankai {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(60px, 16vw, 160px); letter-spacing: 6px; color: #ffd400;
      text-shadow: 0 0 30px #ff3d00, 0 0 70px #ff3d00;
      z-index: 5; opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #bankai.muncul { animation: bankai 2.2s ease forwards; }
    @keyframes bankai {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
  
    /* ===== TOMBOL KEMBALI KE MENU AWAL (PORTOFOLIO ROBIN) ===== */
    .menu-robin {
      position: fixed; left: 14px; bottom: 14px; z-index: 50;
      font-family: 'Anton', Impact, sans-serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none; color: #f5f5f5;
      background: rgba(8,8,18,0.85); border: 2px solid #f5f5f5;
      padding: 8px 14px; transition: all 0.2s;
    }
    .menu-robin:hover { background: #f5f5f5; color: #000; transform: translateY(-2px); }
    body { padding-bottom: 64px !important; }
  </style>
</head>
<body>
  <a class="menu-robin" href="https://muqorobin298-lab.github.io/Robin_Dev/">← Menu Awal</a>

  <div id="scene"></div>
  <div id="sparks"></div>
  <div id="bankai">SELESAI!</div>

  <div class="box">
    <h1>Pomodoro <span>Bleach</span></h1>
    <p class="lokasi" id="lokasi"></p>

    <div class="mode" id="mode"></div>

    <div class="waktu" id="waktu">25:00</div>
    <div class="bar"><i id="bar"></i></div>
    <p class="pesan" id="pesan"></p>

    <div class="kontrol">
      <button class="btn" id="mulai">Mulai</button>
      <button class="btn sekunder" id="reset">Reset</button>
    </div>
    <p class="sesi" id="sesi"></p>
  </div>

  <script>
    const tema = {
      awal:    { nama: "Senja Karakura", kanji: "代行", g: "linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%)", orb: "radial-gradient(circle,#fff3c4 0%,#ffd27a 60%,#ff9a3c 100%)", glow: "#ffb347", city: "#1a0a12", accent: "#ff6a00", spark: "#ffcf8a" },
      tengah:  { nama: "Soul Society", kanji: "死神", g: "linear-gradient(to top,#3b1d5e,#1a1040 45%,#050510 100%)", orb: "radial-gradient(circle,#fff6dc 0%,#fff1d0 70%,#ffe2a0 100%)", glow: "#fff1d0", city: "#000000", accent: "#a855f7", spark: "#e0c8ff" },
      akhir:   { nama: "BANKAI!", kanji: "卍解", g: "linear-gradient(to top,#ff7b3d,#7a0b1b 45%,#2b0008 100%)", orb: "radial-gradient(circle,#fffbe0 0%,#ffe9b0 60%,#ffd400 100%)", glow: "#ffd400", city: "#1a0004", accent: "#ffd400", spark: "#ffe28a" },
      istirahat:{ nama: "Istana Es", kanji: "氷", g: "linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%)", orb: "radial-gradient(circle,#ffffff 0%,#e0f7ff 70%,#9fe3ff 100%)", glow: "#aeeaff", city: "#04182e", accent: "#38d4ff", spark: "#ffffff" },
      panjang: { nama: "Malam Bersalju", kanji: "月", g: "linear-gradient(to top,#2a4a7a,#10234a 50%,#030818 100%)", orb: "radial-gradient(circle,#ffffff 0%,#dbeafe 70%,#a5c8ff 100%)", glow: "#bcd8ff", city: "#050b1a", accent: "#4da6ff", spark: "#d6e8ff" },
      selesai: { nama: "Hujan Sakura", kanji: "桜", g: "linear-gradient(to top,#ff9ec4,#a8326b 45%,#2a0b2e 100%)", orb: "radial-gradient(circle,#fff0f6 0%,#ffc2da 70%,#ff8fba 100%)", glow: "#ffb3d1", city: "#1f0720", accent: "#ff5c9e", spark: "#ffd0e3" }
    };
    const urutan = Object.keys(tema);

    const kota = `<svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="CITYCOLOR">
      <rect x="0" y="270" width="1200" height="30"/>
      <path d="M90 270 V190 H130 V270 Z"/><path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/><path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/><path d="M95 150 L110 125 L125 150 Z"/>
      <path d="M200 270 V215 H420 V270 Z"/><path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <path d="M520 270 V160 H580 V270 Z"/><path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/><path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/><path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/><path d="M540 82 L550 50 L560 82 Z"/>
      <path d="M680 270 V220 H860 V270 Z"/><path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <path d="M930 270 V185 H980 V270 Z"/><path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/><path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/><path d="M938 140 L955 112 L972 140 Z"/>
      <path d="M1060 270 V225 H1200 V270 Z"/><path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>`;

    const scene = document.getElementById("scene");
    const layers = {};
    urutan.forEach(k => {
      const t = tema[k];
      const d = document.createElement("div");
      d.className = "layer";
      d.style.background = t.g;
      d.innerHTML =
        '<div class="kanji">' + t.kanji + '</div>' +
        '<div class="orb" style="background:' + t.orb + ';box-shadow:0 0 40px ' + t.glow + ',0 0 110px ' + t.glow + '"></div>' +
        kota.replace("CITYCOLOR", t.city);
      scene.appendChild(d);
      layers[k] = d;
    });

    const sparks = document.getElementById("sparks");
    for (let n = 0; n < 35; n++) {
      const s = document.createElement("div");
      s.className = "spark";
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 10) + "s";
      sparks.appendChild(s);
    }

    let temaAktif = "";
    function gantiTema(k) {
      if (k === temaAktif) return;
      temaAktif = k;
      const t = tema[k];
      urutan.forEach(n => layers[n].classList.toggle("aktif", n === k));
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--spark", t.spark);
      document.getElementById("lokasi").textContent = "// " + t.nama;
    }

    // ===== LOGIKA POMODORO =====
    const $ = id => document.getElementById(id);
    const modeList = [
      { nama: "Fokus", menit: 25, fokus: true },
      { nama: "Istirahat", menit: 5, fokus: false, tema: "istirahat" },
      { nama: "Istirahat Panjang", menit: 15, fokus: false, tema: "panjang" }
    ];

    let modeIdx = 0, totalDetik = 25 * 60, sisaDetik = 25 * 60;
    let jalan = false, akhirMs = 0, timer = null, sesiHariIni = 0;

    // Hitungan sesi per hari (reset otomatis tiap ganti hari)
    const hariIni = new Date().toDateString();
    try {
      const d = JSON.parse(localStorage.getItem("pomodoroBleach"));
      if (d && d.hari === hariIni) sesiHariIni = d.sesi;
    } catch (e) {}

    function simpanSesi() {
      try { localStorage.setItem("pomodoroBleach", JSON.stringify({ hari: hariIni, sesi: sesiHariIni })); } catch (e) {}
    }

    function format(d) {
      const m = Math.floor(d / 60), s = d % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function bip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.25, 0.5].forEach(t => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.2, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
          o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.22);
        });
      } catch (e) {}
    }

    function tampil() {
      $("waktu").textContent = format(sisaDetik);
      document.title = format(sisaDetik) + " | Pomodoro Bleach";
      const persen = 100 - (sisaDetik / totalDetik * 100);
      $("bar").style.width = persen + "%";
      $("sesi").textContent = "SESI FOKUS SELESAI HARI INI: " + sesiHariIni;

      const m = modeList[modeIdx];
      if (m.fokus) {
        if (persen >= 85) gantiTema("akhir");
        else if (persen >= 50) gantiTema("tengah");
        else gantiTema("awal");
      } else {
        gantiTema(m.tema);
      }
    }

    function pesan(t) { $("pesan").textContent = t; }

    function pilihMode(i) {
      clearInterval(timer); jalan = false;
      modeIdx = i;
      totalDetik = sisaDetik = modeList[i].menit * 60;
      $("mulai").textContent = "Mulai";
      document.querySelectorAll(".mode button").forEach((b, n) => b.classList.toggle("pilih", n === i));
      pesan(modeList[i].fokus ? "Siap fokus? Tekan Mulai." : "Waktunya mengisi ulang reiatsu.");
      temaAktif = "";
      tampil();
    }

    function ketukan() {
      sisaDetik = Math.max(0, Math.round((akhirMs - Date.now()) / 1000));
      tampil();
      if (sisaDetik <= 0) selesai();
    }

    function selesai() {
      clearInterval(timer); jalan = false;
      $("mulai").textContent = "Mulai";
      bip();
      const b = $("bankai");
      b.classList.remove("muncul"); void b.offsetWidth; b.classList.add("muncul");
      temaAktif = ""; gantiTema("selesai");
      if (modeList[modeIdx].fokus) {
        sesiHariIni++; simpanSesi();
        $("sesi").textContent = "SESI FOKUS SELESAI HARI INI: " + sesiHariIni;
        pesan("Mantap, satu sesi selesai! Ambil istirahat 5 menit.");
      } else {
        pesan("Istirahat selesai. Siap fokus lagi?");
      }
      document.title = "Selesai! | Pomodoro Bleach";
    }

    $("mulai").onclick = () => {
      if (jalan) {
        clearInterval(timer); jalan = false;
        $("mulai").textContent = "Lanjut";
        pesan("Dijeda.");
      } else {
        if (sisaDetik <= 0) sisaDetik = totalDetik;
        akhirMs = Date.now() + sisaDetik * 1000;
        jalan = true;
        timer = setInterval(ketukan, 250);
        $("mulai").textContent = "Jeda";
        pesan(modeList[modeIdx].fokus ? "Fokus! Jangan buka yang lain dulu." : "Santai dulu, tarik napas.");
      }
    };

    $("reset").onclick = () => pilihMode(modeIdx);

    modeList.forEach((m, i) => {
      const b = document.createElement("button");
      b.textContent = m.nama;
      b.onclick = () => pilihMode(i);
      $("mode").appendChild(b);
    });

    pilihMode(0);
  </script>
</body>
</html>
